<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小島探險地圖</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700;900&display=swap">

<style>
/* Layout: a full-screen low-poly 3D sea with 7 hex islands; white pill labels float over it,
   brand card top-left, a rail of round-square buttons top-right, and one info panel
   (side card on desktop, bottom sheet on phones). Single light look over a 3D scene. */
:root {
  --sky: #bfe3f0;
  --paper: rgba(255, 255, 255, .94);
  --ink: #26303b;
  --muted: #6b7480;
  --orange: #e8622c;
  --line: #ece4d6;
  --font-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

#app { position: fixed; inset: 0; }
#app canvas { display: block; touch-action: none; }
.labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

.pill {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  border: 0; border-radius: 999px; background: var(--paper);
  padding: 6px 14px; font-weight: 700; font-size: 15px; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(30, 40, 60, .18);
  display: flex; gap: 6px; align-items: baseline;
}
.pill .num { color: var(--orange); font-size: 13px; font-variant-numeric: tabular-nums; }
.pill.me { cursor: default; font-size: 16px; pointer-events: none; }
.pill.me b { font-weight: 900; }
.pill.me span { color: var(--orange); }
.bubble {
  position: absolute; left: 0; top: 0; pointer-events: none;
  background: #fff; border-radius: 16px; padding: 7px 13px;
  font-family: var(--font-display); font-size: 16px; white-space: nowrap;
  box-shadow: 0 3px 10px rgba(30, 40, 60, .2);
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }

.brand {
  position: fixed; z-index: 3;
  top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
  background: var(--paper); border-radius: 22px; padding: 12px 16px;
  display: flex; gap: 14px; align-items: center;
  box-shadow: 0 4px 16px rgba(30, 40, 60, .15);
  max-width: calc(100% - 110px);
}
.mark { font-family: var(--font-display); color: var(--orange); font-size: 30px; line-height: 1; letter-spacing: .02em; }
.brand-text { display: grid; gap: 3px; min-width: 0; }
.brand-text b { font-size: 17px; letter-spacing: .1em; font-weight: 900; }
.passport { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.stamps { display: flex; gap: 3px; }
.stamp { width: 13px; height: 13px; border-radius: 50%; border: 2px dashed #c9c2b4; }
.stamp.on { border: 0; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); }

.rail {
  position: fixed; z-index: 3; display: grid; gap: 10px;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
}
.rail button {
  width: 86px; height: 58px; border: 0; border-radius: 18px; cursor: pointer;
  background: var(--paper); box-shadow: 0 3px 12px rgba(30, 40, 60, .15);
  display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 16px;
}
.rail button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.rail button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.panel {
  position: fixed; z-index: 4;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(110px + env(safe-area-inset-right, 0px));
  width: 360px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: auto; background: #fff; border-radius: 22px; padding: 18px 18px 20px;
  box-shadow: 0 8px 30px rgba(30, 40, 60, .22);
  display: grid; gap: 14px; align-content: start;
}
.panel-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.2; }
.panel h2 .num { color: var(--orange); font-size: 18px; margin-right: 6px; font-family: var(--font-body); font-weight: 700; }
.panel .sub { margin: 2px 0 0; color: var(--muted); }
.close { border: 0; background: var(--line); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; flex: none; font-size: 18px; line-height: 1; }
.label { font-size: 12px; color: var(--muted); letter-spacing: .12em; margin: 0 0 6px; }
.spots { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.spot { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 9px 11px; border-radius: 14px; background: #f7f3ec; }
.spot.hit { box-shadow: inset 0 0 0 2px var(--orange); }
.spot i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.spot h3 { margin: 0; font-size: 15px; }
.spot p { margin: 1px 0 0; color: var(--muted); font-size: 13.5px; }
.today { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #f2f8dc; }
.today .label { margin: 0; }
.today b { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin-right: 8px; }
.today span { color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; cursor: pointer; text-align: left; font-size: 13.5px; }
.chip b { margin-right: 4px; }
.chip span { color: var(--muted); }
.go { border: 0; border-radius: 999px; background: var(--orange); color: #fff; font-weight: 700; padding: 11px 18px; cursor: pointer; font-size: 16px; }
.search { width: 100%; padding: 10px 14px; border-radius: 999px; border: 2px solid var(--line); background: #fff; }
.search:focus { border-color: var(--orange); outline: none; }
.isle-list { display: grid; gap: 8px; }
.isle-row { border: 0; background: #f7f3ec; border-radius: 14px; padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.isle-row b { font-size: 16px; }
.isle-row b .num { color: var(--orange); margin-right: 6px; font-size: 13px; }
.isle-row span { color: var(--muted); font-size: 13.5px; }
.isle-row mark { background: #ffe1cf; color: inherit; border-radius: 4px; padding: 0 2px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--orange); }
.row { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.row input { width: 20px; height: 20px; accent-color: var(--orange); }

.hint {
  position: fixed; z-index: 2;
  left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--paper); border-radius: 999px; padding: 8px 14px; font-size: 13.5px;
  box-shadow: 0 3px 12px rgba(30, 40, 60, .15); transition: opacity .5s; max-width: calc(100% - 24px);
}
.toast {
  position: fixed; z-index: 6; left: 50%; transform: translate(-50%, 20px);
  bottom: calc(60px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 999px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; text-align: center; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 8; background: var(--sky); font-family: var(--font-display); font-size: 22px; transition: opacity .6s; padding: 16px; text-align: center; }

@media (max-width: 700px) {
  .brand { padding: 9px 12px; gap: 10px; border-radius: 18px; }
  .mark { display: none; }
  .hint .more { display: none; }
  .brand-text b { font-size: 14px; }
  .rail { gap: 8px; }
  .rail button { width: 64px; height: 50px; font-size: 14px; flex-direction: column; gap: 0; border-radius: 16px; }
  .panel {
    top: auto; right: 0; left: 0; bottom: 0; width: auto; max-height: 58%;
    border-radius: 22px 22px 0 0;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .pill { font-size: 13px; padding: 5px 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="labels" id="labels"></div>

<div class="brand">
  <div class="mark">小島<br>出發！</div>
  <div class="brand-text">
    <b>小島探險地圖</b>
    <div class="passport"><span id="pcount">探險護照 0/8</span><span class="stamps" id="stamps"></span></div>
  </div>
</div>

<nav class="rail" aria-label="地圖工具">
  <button id="b-view"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>全景</button>
  <button id="b-char" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5q3.5 3 7 0M9 10h.01M15 10h.01"/></svg>角色</button>
  <button id="b-list" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>清單</button>
  <button id="b-time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="time-label">白天</span></button>
</nav>

<section class="panel" id="panel" hidden aria-live="polite"></section>
<div class="hint" id="hint">點地面，「我」就會走過去<span class="more">・拖曳轉動・雙指或滾輪縮放</span></div>
<div class="toast" id="toast" role="status"></div>
<div class="loading" id="loading">小島浮出水面中…</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------- data ----------
const ISLANDS = [

  { id: "hotel", name: "飯店島", q: -1, r: 1, color: "#c5b2ee", tagline: "拿著房卡，住進雲朵一樣的房間", spots: [

    ["雲朵大床房", "枕頭有五顆，窗外就是大海和星星。", "床 枕頭 睡覺"],
    ["泳池滑水道", "穿好泳衣，從彎彎的滑水道溜下去，噗通！", "游泳 泳池 滑水道"],
    ["自助早餐吧", "鬆餅、水果、玉米濃湯，自己拿想吃的。", "早餐 鬆餅 自助餐"],
    ["客房服務電話", "撥 9 號就能請服務生送來熱牛奶。", "電話 牛奶 服務"]]},

// ---------- helpers ----------

const matCache = new Map();
function mat(color) {
  if (color && color.isMaterial) return color;
  if (!matCache.has(color)) matCache.set(color, new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: .85 }));
  return matCache.get(color);
}
const glowMats = [];
function glow(color, dayEmissive = 0) {
  const m = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: dayEmissive, flatShading: true, roughness: .6 });
  m.userData.day = dayEmissive;
  glowMats.push(m);
  return m;
}
function add(parent, geo, color, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat(color));
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
const Bx = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const Cy = (rt, rb, h, s = 12) => new THREE.CylinderGeometry(rt, rb, h, s);
const Sp = (r, w = 12, h = 8) => new THREE.SphereGeometry(r, w, h);
const Co = (r, h, s = 8) => new THREE.ConeGeometry(r, h, s);
const group = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };

const SPACING = 13.9, SQ3 = Math.sqrt(3);
const TOP = 1.5, HEX_R = 9.6, WALK_R = 7.0;

ISLANDS.forEach(i => CENTER[i.id] = new THREE.Vector3(SPACING * SQ3 * (i.q + i.r / 2), 0, SPACING * 1.5 * i.r));

// water
const waterMat = new THREE.MeshStandardMaterial({ color: "#5ea3b8", flatShading: true, roughness: .5, metalness: .05 });
const waterGeo = new THREE.PlaneGeometry(420, 420, 70, 70);
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI / 2;
water.receiveShadow = true;
scene.add(water);
function animateWater(t) {
  const p = waterGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    p.setZ(i, Math.sin(x * .16 + t * .9) * .18 + Math.cos(y * .13 + t * .7) * .18);
  }
  p.needsUpdate = true;
  waterGeo.computeVertexNormals();
}
animateWater(0);

function tree(parent, x, z, s = 1, leaf = "#6fb35a") {
  const g = group(parent, x, TOP, z);
  g.scale.setScalar(s);
  add(g, Cy(.22, .32, 1.4, 6), "#8a5a35", 0, .7, 0);
  add(g, new THREE.IcosahedronGeometry(1.35, 0), leaf, 0, 2.2, 0);
  add(g, new THREE.IcosahedronGeometry(.9, 0), leaf, .5, 3.1, .2);
  return g;
}
function lamp(parent, x, z) {
  const g = group(parent, x, TOP, z);
  add(g, Cy(.08, .1, 2.6, 6), "#3a4250", 0, 1.3, 0);
  add(g, Bx(.5, .12, .5), "#3a4250", 0, 2.65, 0);
  add(g, Sp(.26, 8, 6), glow("#ffe7a8"), 0, 2.85, 0);
}

// ---------- islands ----------
const TREE_SPOTS = [Math.PI * .67, Math.PI, Math.PI * 1.33];
ISLANDS.forEach((isl, idx) => {
  const g = group(scene, CENTER[isl.id].x, 0, CENTER[isl.id].z);
  const base = add(g, Cy(HEX_R, HEX_R + .5, 2.4, 6), "#e3d2ab", 0, 0, 0);
  const top = add(g, Cy(HEX_R - .6, HEX_R - .6, .3, 6), isl.color, 0, TOP - .15, 0);
  base.userData.ground = top.userData.ground = isl.id;
  grounds.push(base, top);
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3 + .4;
    add(g, new THREE.DodecahedronGeometry(rnd(.5, .9), 0), "#b7ab95", Math.sin(a) * (HEX_R + .3), rnd(-.4, .3), Math.cos(a) * (HEX_R + .3));
  }
  const lm = group(g);
  lm.userData.landmark = isl.id;
  landmarks.push(lm);
  BLOCK[isl.id] = BUILD[isl.id](lm);
  TREE_SPOTS.forEach((a, k) => {
    const x = Math.sin(a) * 7.4, z = Math.cos(a) * 7.4;
    tree(g, x, z, rnd(.8, 1.1), k % 2 ? "#6fb35a" : "#5fa64f");
    BLOCK[isl.id].push({ x, z, r: 1 });
  });
  const la = (idx % 2 ? 1 : -1) * Math.PI / 3;
  lamp(g, Math.sin(la) * 7.6, Math.cos(la) * 7.6);
});

// ---------- bridges ----------
BRIDGES.forEach(([a, b]) => {
  const A = CENTER[a], B = CENTER[b];
  const d = B.clone().sub(A);
  const len = d.length() - 2 * HEX_R * Math.cos(Math.PI / 6) + 2.4;
  const mid = A.clone().add(B).multiplyScalar(.5);
  const g = group(scene, mid.x, 0, mid.z);
  g.rotation.y = Math.atan2(d.x, d.z);
  const deck = add(g, Bx(2.8, .3, len), "#c4935e", 0, TOP - .15, 0);
  deck.userData.ground = `${a}|${b}`;
  grounds.push(deck);
  for (let z = -len / 2 + .5; z < len / 2; z += .7) add(g, Bx(2.9, .06, .14), "#a87a48", 0, TOP + .02, z);
  [-1.35, 1.35].forEach(x => {
    add(g, Bx(.12, .12, len - 2.2), "#8a5a35", x, TOP + .95, 0);
    for (let z = -len / 2 + 1.2; z <= len / 2 - 1.1; z += 1.6) add(g, Cy(.08, .08, 1, 6), "#8a5a35", x, TOP + .5, z);
  });
  add(g, Cy(.25, .25, 3, 6), "#8a5a35", -1, 0, 0);
  add(g, Cy(.25, .25, 3, 6), "#8a5a35", 1, 0, 0);
});

function makeWalker(opts, island, pos) {
  const kid = opts.make ? opts.make() : makeKid(opts);
  const w = { kid, island, pos: pos.clone(), queue: [], wait: rnd(0, 2), phase: rnd(0, 6), swing: 0, speed: rnd(2.2, 3), ...opts.extra };
  kid.g.traverse(o => o.userData.walker = w);
  kid.g.position.copy(w.pos);
  kid.g.rotation.y = rnd(-1, 1);
  walkers.push(w);
  return w;
}
function freeSpot(id) {
  const c = CENTER[id];
  for (let t = 0; t < 30; t++) {
    const a = rnd(0, Math.PI * 2), r = Math.sqrt(Math.random()) * WALK_R;
    const x = Math.sin(a) * r, z = Math.cos(a) * r;
    if (BLOCK[id].every(b => Math.hypot(x - b.x, z - b.z) > b.r + .5)) return new THREE.Vector3(c.x + x, TOP, c.z + z);
  }
  return new THREE.Vector3(c.x, TOP, c.z + 5);
}
function clampOnIsland(id, p) {
  const c = CENTER[id];
  let x = p.x - c.x, z = p.z - c.z;
  const r = Math.hypot(x, z);
  if (r > WALK_R) { x *= WALK_R / r; z *= WALK_R / r; }
  for (const b of BLOCK[id]) {
    const dx = x - b.x, dz = z - b.z, d = Math.hypot(dx, dz) || 1;
    if (d < b.r + .5) { x = b.x + dx / d * (b.r + .5); z = b.z + dz / d * (b.r + .5); }
  }
  return new THREE.Vector3(c.x + x, TOP, c.z + z);
}
function nearestIsland(p) {
  let best = null, bd = Infinity;
  for (const id in CENTER) { const d = Math.hypot(p.x - CENTER[id].x, p.z - CENTER[id].z); if (d < bd) { bd = d; best = id; } }
  return { id: best, dist: bd };
}
function islandPath(from, to) {
  const prev = { [from]: null }, q = [from];
  while (q.length) { const n = q.shift(); if (n === to) break; for (const m of NEIGHBORS[n]) if (!(m in prev)) { prev[m] = n; q.push(m); } }
  const path = [];
  for (let n = to; n != null; n = prev[n]) path.unshift(n);
  return path;
}
// waypoints along the bridges for a list of islands
function hops(path) {
  const pts = [];
  for (let i = 0; i < path.length - 1; i++) {
    const A = CENTER[path[i]], B = CENTER[path[i + 1]];
    const d = B.clone().sub(A).normalize();
    pts.push(A.clone().addScaledVector(d, 6.6).setY(TOP), Object.assign(B.clone().addScaledVector(d, -6.6).setY(TOP), { island: path[i + 1] }));
  }
  return pts;
}

function planNpc(w) {
  if (!w.stay && Math.random() < .28) {
    const other = pick(NEIGHBORS[w.island]);
    w.queue = [...hops([w.island, other]), Object.assign(freeSpot(other), { island: other })];
  } else {
    w.queue = [freeSpot(w.island)];
  }
}
const lerpAngle = (a, b, t) => a + ((((b - a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) - Math.PI) * t;
function pose(w, moving, dt) {
  w.swing += ((moving ? 1 : 0) - w.swing) * Math.min(1, dt * 8);
  const s = Math.sin(w.phase) * .7 * w.swing;
  w.kid.legs[0].rotation.x = s; w.kid.legs[1].rotation.x = -s;
  w.kid.arms[0].rotation.x = -s * .8; w.kid.arms[1].rotation.x = s * .8;
  w.kid.inner.position.y = Math.abs(Math.sin(w.phase)) * .14 * w.swing;
  w.kid.g.position.copy(w.pos);
}
function stepWalker(w, dt) {
  if (w.wait > 0) { w.wait -= dt; pose(w, 0, dt); return; }
  if (!w.queue.length) {
    if (w.isPlayer || w.isChief || reduceMotion) { pose(w, 0, dt); return; }
    planNpc(w);
  }
  const t = w.queue[0];
  const dx = t.x - w.pos.x, dz = t.z - w.pos.z, dist = Math.hypot(dx, dz), mv = w.speed * dt;
  if (dist > .01) w.kid.g.rotation.y = lerpAngle(w.kid.g.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 10));
  if (dist <= mv) {
    w.pos.set(t.x, TOP, t.z);
    if (t.island) w.island = t.island;
    w.queue.shift();
    if (!w.queue.length) {
      if (w.isPlayer) marker.visible = false;
      else w.wait = rnd(1, 4);
    }
  } else {
    w.pos.x += dx / dist * mv; w.pos.z += dz / dist * mv;
  }
  w.phase += dt * w.speed * 2.8;
  pose(w, 1, dt);
}

      <span>明天換${POKEMON[(DAY + 1) % POKEMON.length].name}</span></div><button class="chip" id="next-mon">叫下一隻出來</button></div>` : ""}
    <div><p class="label">島上的 ${isl.spots.length} 個好玩地方</p>
      <ol class="spots">${isl.spots.map(([n, d, t], k) => `<li class="spot ${term && (n + d + t).includes(term) ? "hit" : ""}">
        <i style="background:${isl.color}">${k + 1}</i><div><h3>${n}</h3><p>${d}</p></div></li>`).join("")}</ol></div>
    <div><p class="label">走好朋友橋，去隔壁島</p>
      <div class="chips">${friends.map(f => `<button class="chip" data-go="${f.other}"><b>${byId[f.other].name}</b><span>${f.why}</span></button>`).join("")}</div></div>`);
  panel.querySelector("#next-mon")?.addEventListener("click", () => {
    spawnMon((monIdx + 1) % POKEMON.length);
    say(monWalker, POKEMON[monIdx].lines[0]);
    openIsland(id, false, term);
  });
  panel.querySelector("#go").addEventListener("click", () => {
    walkPlayerTo(CENTER[id].clone().add(new THREE.Vector3(rnd(-2, 2), 0, 5)), id);
    if (innerWidth <= 700) setPanel(null);
  });
  panel.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => openIsland(b.dataset.go, true)));
  if (fly) focusIsland(id);
}

function openList(term = "") {
  const t = term.trim();
  const rows = ISLANDS.map(isl => {
    const hits = t ? isl.spots.filter(([n, d, tags]) => (n + d + tags).includes(t)) : [];
    if (t && !hits.length && !isl.name.includes(t)) return "";
    const hl = s => t ? esc(s).split(esc(t)).join(`<mark>${esc(t)}</mark>`) : esc(s);
    const sub = t && hits.length ? hits.map(h => hl(h[0])).join("、") : esc(isl.spots.map(s => s[0]).join("、"));
    return `<button class="isle-row" data-id="${isl.id}"><b><span class="num">${isl.num}</span>${hl(isl.name)}</b><span>${sub}</span></button>`;
  }).join("");
  setPanel("list", `
    <div class="panel-head"><h2>島嶼清單</h2><button class="close" aria-label="關閉">×</button></div>
    <input class="search" id="search" type="search" placeholder="找找看：蛋餅、恐龍、摩天輪…" value="${esc(term)}" aria-label="搜尋島上的地點">
    <div class="isle-list">${rows || `<p class="sub">沒有找到「${esc(t)}」，換個字試試看，例如：游泳、恐龍、蛋餅。</p>`}</div>`);
  const input = panel.querySelector("#search");
  input.addEventListener("input", () => {
    const pos = input.selectionStart;
    openList(input.value);
    const again = panel.querySelector("#search");
    again.focus();
    again.setSelectionRange(pos, pos);
  });
  panel.querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", () => openIsland(b.dataset.id, true, t)));
}

const LOOKS = ["#e8622c", "#3d8fe0", "#4fb38a", "#8e7cc3", "#f07fa6", "#ffd23f"];
function openChar() {
  setPanel("char", `
    <div class="panel-head"><div><h2>我的角色</h2><p class="sub">選一件喜歡的衣服，再出發去探險。</p></div><button class="close" aria-label="關閉">×</button></div>
    <div><p class="label">衣服顏色</p><div class="swatches">${LOOKS.map(c =>
      `<button class="swatch" data-c="${c}" style="background:${c}" aria-label="衣服顏色" aria-pressed="${c === savedLook.shirt}"></button>`).join("")}</div></div>
    <label class="row"><input type="checkbox" id="opt-hat" ${savedLook.hat ? "checked" : ""}>戴上探險帽</label>
    <label class="row"><input type="checkbox" id="opt-follow" ${follow ? "checked" : ""}>鏡頭跟著我走</label>`);
  panel.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => {
    savedLook.shirt = b.dataset.c; store.set("island-look", savedLook); rebuildPlayer(savedLook);
    panel.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-pressed", String(s === b)));
  }));
  panel.querySelector("#opt-hat").addEventListener("change", e => { savedLook.hat = e.target.checked; store.set("island-look", savedLook); rebuildPlayer(savedLook); });
  panel.querySelector("#opt-follow").addEventListener("change", e => { follow = savedLook.follow = e.target.checked; store.set("island-look", savedLook); });
}

document.getElementById("b-view").addEventListener("click", () => { setPanel(null); overview(); });
bChar.addEventListener("click", () => panelMode === "char" ? setPanel(null) : openChar());
bList.addEventListener("click", () => panelMode === "list" ? setPanel(null) : openList());

// ---------- time of day ----------
const TIMES = [
  { name: "白天", sky: "#bfe3f0", hemi: ["#ffffff", "#b9a98a", 1.3], sun: ["#fff6e8", 2.2], water: "#5ea3b8", glow: 0 },
  { name: "傍晚", sky: "#f7c8a0", hemi: ["#ffd9b8", "#9a7f6a", 1], sun: ["#ffb27a", 1.7], water: "#5d8ea6", glow: .6 },
  { name: "晚上", sky: "#1c2b4a", hemi: ["#7f93c9", "#2a2f45", .55], sun: ["#9fb5ff", .5], water: "#24466e", glow: 1.4 }
];
let timeIdx = 0;
function applyTime(i) {
  const T = TIMES[i];
  scene.background.set(T.sky); scene.fog.color.set(T.sky);
  hemi.color.set(T.hemi[0]); hemi.groundColor.set(T.hemi[1]); hemi.intensity = T.hemi[2];
  sun.color.set(T.sun[0]); sun.intensity = T.sun[1];
  waterMat.color.set(T.water);
  glowMats.forEach(m => m.emissiveIntensity = Math.max(m.userData.day, T.glow));
  document.body.style.background = T.sky;
  document.getElementById("time-label").textContent = T.name;
}
document.getElementById("b-time").addEventListener("click", () => { timeIdx = (timeIdx + 1) % TIMES.length; applyTime(timeIdx); toast(`現在是${TIMES[timeIdx].name}`); });

// ---------- tapping the world ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, id: e.pointerId }; tween = null; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || down.id !== e.pointerId || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down = null; return; }
  down = null;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const targets = [...walkers.map(w => w.kid.g), ...landmarks, ...grounds];
  for (const hit of ray.intersectObjects(targets, true)) {
    let o = hit.object;
    while (o && !o.userData.walker && !o.userData.landmark && !o.userData.ground) o = o.parent;
    if (!o) continue;
    if (o.userData.walker) { tapWalker(o.userData.walker); return; }
    if (o.userData.landmark) { openIsland(o.userData.landmark, false); return; }
    const g = o.userData.ground;
    if (g.includes("|")) {
      // a bridge: walk to whichever end is closer, then out onto the bridge
      const [a, b] = g.split("|");
      const cur = nearestIsland(player.pos).id;
      const end = islandPath(cur, a).length <= islandPath(cur, b).length ? a : b;
      const final = hit.point.clone().setY(TOP);
      sendPlayer([...hops(islandPath(cur, end)), final], final);
    } else {
      walkPlayerTo(hit.point, g);
    }
    return;
  }
});
function tapWalker(w) {
  if (w.isPlayer) { say(w, "我們去探險吧！"); return; }
  if (w.isChief) {
    const from = w.island;
    const to = pick(ISLANDS.filter(i => i.id !== from)).id;
    toast(`你在${byId[from].name}找到小島長了！他又偷偷跑去${byId[to].name}…`);
    w.island = to; w.pos.copy(freeSpot(to)); w.kid.g.position.copy(w.pos);
    return;
  }
  say(w, w.mon ? pick(w.mon.lines) : pick(SAYS[nearestIsland(w.pos).id]));
}

// ---------- loop ----------
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderStamps();
applyTime(0);
overview();
if (tween) { controls.target.copy(tween.tT); camera.position.copy(tween.tP); tween = null; }
checkVisit();

const clock = new THREE.Clock();
let elapsed = 0;
function frame() {
  const dt = Math.min(.05, clock.getDelta());
  elapsed += dt;
  if (!reduceMotion) {
    animateWater(elapsed);
    spinners.forEach(f => f(dt));
    const a = elapsed * .05;
    boat.position.set(Math.cos(a) * 58, Math.sin(elapsed * 1.5) * .1, Math.sin(a) * 50);
    boat.rotation.y = -a;
  } else {
    boat.position.set(-58, 0, 20);
  }
  walkers.forEach(w => stepWalker(w, dt));
  if (!chief.queue.length) chief.kid.g.rotation.y += dt * .8;
  checkVisit();
  if (marker.visible) marker.scale.setScalar(1 + Math.sin(elapsed * 6) * .12);

  if (tween) {
    tween.t = Math.min(1, tween.t + dt);
    const e = 1 - Math.pow(1 - tween.t, 3);
    controls.target.lerpVectors(tween.fT, tween.tT, e);
    camera.position.lerpVectors(tween.fP, tween.tP, e);
    if (tween.t >= 1) tween = null;
  } else if (follow) {
    up.copy(player.pos).sub(controls.target).setY(0).multiplyScalar(Math.min(1, dt * 3));
    controls.target.add(up); camera.position.add(up);
  }
  controls.update();
  renderer.render(scene, camera);

  pills.forEach(p => place(p.el, p.world));
  place(mePill, up.copy(player.pos).setY(TOP + 3.1));
  const now = performance.now();
  walkers.forEach(w => {
    if (!w.bubble) return;
    if (now > w.bubble.until) { w.bubble.el.remove(); w.bubble = null; return; }
    place(w.bubble.el, up.copy(w.pos).setY(TOP + (w.isPlayer ? 4.4 : 3)), -6);
  });
  requestAnimationFrame(frame);
}
frame();
const loading = document.getElementById("loading");
loading.style.opacity = 0;
setTimeout(() => loading.remove(), 700);
</script>
